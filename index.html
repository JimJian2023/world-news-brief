<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World News Brief · 全球新闻简报</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .gradient-header { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #3730a3 100%); }
        .dark .gradient-header { background: linear-gradient(135deg, #0f0d2e 0%, #1e1b4b 50%, #312e81 100%); }
        .lang-btn { cursor: pointer; transition: all 0.2s; }
        .lang-btn.active { background: rgba(255,255,255,0.2); font-weight: 600; }
        .content-panel { display: none; }
        .content-panel.active { display: block; }
        .zh-text { font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif; }
        .headline-item { display: block; padding: 0.875rem 1.25rem; text-decoration: none; transition: background-color 0.15s; cursor: pointer; }
        .headline-item:hover { background-color: rgba(99,102,241,0.04); }
        .dark .headline-item:hover { background-color: rgba(99,102,241,0.08); }
        .headline-item:first-child { border-top: none; }
        .view { display: none; }
        .view.active { display: block; }
        .fade-in { animation: fadeIn 0.4s ease-out both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .article-content p { margin-bottom: 0.75rem; line-height: 1.7; }
        .article-content p:last-child { margin-bottom: 0; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-200">
    <header class="gradient-header text-white py-5 px-4 shadow-md mb-5 relative overflow-hidden">
        <div class="max-w-3xl mx-auto text-center relative z-10">
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight">🌍 World News Brief</h1>
            <p class="text-xs text-indigo-200 mt-1">Click a headline to read the full story</p>
            <div class="mt-2 flex items-center justify-center gap-2 text-xs text-indigo-300">
                <span id="date-display" class="bg-white/10 px-2 py-0.5 rounded-full"><!-- DATE_HERE --></span>
            </div>
            <div class="mt-2 inline-flex bg-white/10 rounded-full p-0.5 text-xs">
                <button onclick="switchLang('en')" id="lang-en" class="lang-btn active px-3 py-1 rounded-full">🇬🇧 EN 中英</button>
                <button onclick="switchLang('zh')" id="lang-zh" class="lang-btn px-3 py-1 rounded-full">🇨🇳 中文</button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pb-24">

        <!-- EN PANEL -->
        <div id="panel-en" class="content-panel active">
            <!-- List view -->
            <div id="view-list-en" class="view active">
                <section class="mb-8 fade-in">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="flex items-center text-xl font-bold text-indigo-900 dark:text-indigo-300"><span class="mr-2 text-2xl">📰</span> World Headlines</h2>
                        <span class="text-xs text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-full"><!-- EN_WORLD_COUNT --> stories</span>
                    </div>
                    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm divide-y divide-slate-100 dark:divide-slate-700 overflow-hidden" id="en-world-list">
                        <!-- EN_WORLD_LIST -->
                    </div>
                </section>
                <section class="mb-8 fade-in" style="animation-delay: 0.1s">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="flex items-center text-xl font-bold text-indigo-900 dark:text-indigo-300"><span class="mr-2 text-2xl">🚀</span> Tech Frontiers</h2>
                        <span class="text-xs text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-full"><!-- EN_TECH_COUNT --> stories</span>
                    </div>
                    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm divide-y divide-slate-100 dark:divide-slate-700 overflow-hidden" id="en-tech-list">
                        <!-- EN_TECH_LIST -->
                    </div>
                </section>
                <div class="text-center text-xs text-slate-400 dark:text-slate-600 mt-2 italic">Sources: BBC · New York Times · RT · Al Jazeera</div>
            </div>
            <!-- Article view -->
            <div id="view-article-en" class="view">
                <button onclick="backToList('en')" class="flex items-center gap-1 text-sm text-indigo-600 dark:text-indigo-400 hover:underline mb-4">← Back to headlines</button>
                <div id="en-article-container" class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-6 fade-in"></div>
            </div>
        </div>

        <!-- ZH PANEL -->
        <div id="panel-zh" class="content-panel zh-text">
            <div id="view-list-zh" class="view active">
                <section class="mb-8 fade-in">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="flex items-center text-xl font-bold text-indigo-900 dark:text-indigo-300"><span class="mr-2 text-2xl">📰</span> 世界头条</h2>
                        <span class="text-xs text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-full"><!-- ZH_WORLD_COUNT --> 条</span>
                    </div>
                    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm divide-y divide-slate-100 dark:divide-slate-700 overflow-hidden" id="zh-world-list">
                        <!-- ZH_WORLD_LIST -->
                    </div>
                </section>
                <section class="mb-8 fade-in" style="animation-delay: 0.1s">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="flex items-center text-xl font-bold text-indigo-900 dark:text-indigo-300"><span class="mr-2 text-2xl">🚀</span> 科技前沿</h2>
                        <span class="text-xs text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-full"><!-- ZH_TECH_COUNT --> 条</span>
                    </div>
                    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm divide-y divide-slate-100 dark:divide-slate-700 overflow-hidden" id="zh-tech-list">
                        <!-- ZH_TECH_LIST -->
                    </div>
                </section>
                <div class="text-center text-xs text-slate-400 dark:text-slate-600 mt-2 italic">来源：央视 · 凤凰卫视 · 中天新闻 · 联合早报 · 观察者网 · 参考消息</div>
            </div>
            <div id="view-article-zh" class="view">
                <button onclick="backToList('zh')" class="flex items-center gap-1 text-sm text-indigo-600 dark:text-indigo-400 hover:underline mb-4">← 返回新闻列表</button>
                <div id="zh-article-container" class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-6 fade-in"></div>
            </div>
        </div>

    </main>

    <footer class="fixed bottom-0 w-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-sm border-t border-slate-200 dark:border-slate-700 py-3 px-4 text-center">
        <div class="max-w-3xl mx-auto flex items-center justify-center gap-4 text-xs text-slate-400 dark:text-slate-500">
            <span>Powered by Hermes Agent &amp; GitHub Pages</span>
            <span>·</span>
            <span>Updated at 9 AM &amp; 5 PM NZST</span>
        </div>
    </footer>

    <script>
        // News data embedded as JSON
        window.newsData = <!-- NEWS_JSON -->;

        function openArticle(panel, id) {
            const data = window.newsData;
            let article = null;
            for (const key of Object.keys(data)) {
                if (key.startsWith(panel)) {
                    article = data[key].find(a => a.id === id);
                    if (article) break;
                }
            }
            if (!article) return;

            document.getElementById('view-list-' + panel).classList.remove('active');
            document.getElementById('view-article-' + panel).classList.add('active');

            const container = document.getElementById(panel + '-article-container');
            const dateDisplay = article.date ? `<span class="text-xs text-slate-400">${article.date}</span>` : '';
            const zhSection = article.zh ? `
                <div class="border-t border-slate-100 dark:border-slate-700 pt-4 mt-4">
                    <p class="text-xs text-indigo-400 dark:text-indigo-500 font-medium mb-2">🇨🇳 中文</p>
                    <div class="article-content text-sm text-slate-500 dark:text-slate-400">${article.zh}</div>
                </div>` : '';

            container.innerHTML = `
                <div class="flex items-center gap-2 mb-4 flex-wrap">
                    <span class="text-xs font-medium text-white bg-indigo-600 dark:bg-indigo-500 px-2 py-0.5 rounded-full">${article.source}</span>
                    ${dateDisplay}
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mb-4 leading-snug">${article.headline}</h1>
                <div class="article-content text-sm sm:text-base text-slate-600 dark:text-slate-300">${article.content}</div>
                ${zhSection}
                <a href="${article.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:underline mt-4">
                    Read original article →
                </a>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function backToList(panel) {
            document.getElementById('view-article-' + panel).classList.remove('active');
            document.getElementById('view-list-' + panel).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchLang(lang) {
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('panel-' + lang).classList.add('active');
            document.getElementById('lang-' + lang).classList.add('active');
        }

        if (window.matchMedia('(prefers-color-scheme: dark)').matches) { document.documentElement.classList.add('dark'); }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { document.documentElement.classList.toggle('dark', e.matches); });
    </script>
</body>
</html>
